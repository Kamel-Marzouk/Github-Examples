name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          cd ./github-actions/pg/
          npm install
      - name: Run tests
        run: |
          cd ./github-actions/pg/
          npm run test